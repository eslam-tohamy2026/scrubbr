<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>scrubbr: see what your files leak, then remove it</title>
<meta name="description" content="Offline metadata scrubber. See GPS, serial numbers and author names hidden in photos and Office files, then remove them. Nothing is uploaded.">
<style>
:root{--bg:#0b1020;--card:#131a30;--line:#25304f;--tx:#e8ecf8;--mut:#93a0c4;--acc:#38bdf8;--hi:#f87171;--med:#fbbf24;--low:#94a3b8;--ok:#34d399}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1e2a5a 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:40px;margin:0 0 6px;letter-spacing:-1px}h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 28px;font-size:18px}
#drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:48px 20px;text-align:center;background:var(--card);cursor:pointer;transition:.15s}
#drop.on,#drop:hover{border-color:var(--acc);background:#16203d}
#drop b{font-size:20px}#drop small{display:block;color:var(--mut);margin-top:6px}
.file{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:18px;padding:18px}
.file h3{margin:0 0 4px;font-size:17px;word-break:break-all}.meta{color:var(--mut);font-size:14px}
.verdict{margin:12px 0;padding:10px 14px;border-radius:10px;font-weight:600}
.bad{background:#3a1620;color:#fecaca}.good{background:#0f2f27;color:#a7f3d0}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
td:first-child{width:38%;color:var(--mut)}
.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:1px 7px;border-radius:99px;margin-right:6px;color:#0b1020;font-weight:700}
.high{background:var(--hi)}.med{background:var(--med)}.low{background:var(--low)}
a.btn,button{display:inline-block;margin-top:12px;background:var(--acc);color:#04121f;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.note{color:var(--mut);font-size:13px;margin-top:8px}
footer{margin-top:40px;color:var(--mut);font-size:14px;display:flex;gap:18px;flex-wrap:wrap}footer a{color:var(--acc)}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}.badges span{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--mut)}
img.prev{max-width:140px;max-height:100px;border-radius:8px;float:right;margin-left:12px}
</style></head><body><main>
<h1>scrub<span>br</span></h1>
<p class="sub">See what your photos and documents leak. Then remove it. Everything runs in your browser.</p>
<div class="badges"><span>No upload</span><span>No server</span><span>Zero dependencies</span><span>Works offline</span><span>MIT</span></div>
<label id="drop"><input id="pick" type="file" multiple hidden accept=".jpg,.jpeg,.png,.webp,.docx,.xlsx,.pptx">
<b>Drop files here or click to choose</b><small>JPEG, PNG, WebP, DOCX, XLSX, PPTX</small></label>
<div id="out"></div>
<footer><a href="https://github.com/eslam-tohamy2026/scrubbr">Source on GitHub</a><span>Open DevTools, Network tab: no requests are made.</span></footer>
</main>
<script type="module" src="src/app.js"></script></body></html>
